[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sai-initiative"
version = "0.1.0"
description = "Benchmark-first research and training infrastructure for Sai 4B"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sai-freeze-data = "sai.data.freeze:main"
sai-architecture-plan = "sai.architecture.tournament:main"
sai-model-plan = "sai.model.planner:main"
sai-experiment-plan = "sai.training.experiment:main"
sai-public-gate = "sai.gates.public_benchmarks:main"
sai-readiness = "sai.readiness:main"

[project.optional-dependencies]
train = ["torch>=2.6", "transformers>=5.0"]
dev = ["black>=25.0", "pytest>=8.0", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/sai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
