[project.optional-dependencies]
train = ["torch>=2.6", "tokenizers>=0.22", "transformers>=5.0"]
data = ["zstandard>=0.25"]
dev = ["black>=25.0", "pytest>=8.0", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/sai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
