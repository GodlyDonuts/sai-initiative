[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sai-initiative"
version = "0.1.0"
description = "Benchmark-first research and training infrastructure for Sai 4B"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sai-freeze-data = "sai.data.freeze:main"
sai-freeze-token-stream = "sai.data.token_stream:main"
sai-decontaminate = "sai.data.decontamination:main"
sai-validate-data-mixture = "sai.data.mixture_plan:main"
sai-validate-data-mixture-evidence = "sai.data.mixture_evidence:main"
sai-validate-prerequisites = "sai.data.prerequisite:main"
sai-select-prerequisite-audit = "sai.data.prerequisite_sample:main"
sai-review-prerequisite-audit = "sai.data.prerequisite_review:main"
sai-validate-annotation-policy = "sai.data.annotation_policy:main"
sai-convert-fineweb-edu = "sai.data.fineweb_edu:main"
sai-audit-finemath = "sai.data.finemath_audit:main"
sai-filter-finemath = "sai.data.finemath_filter:main"
sai-build-finemath-review-ladder = "sai.data.finemath_filter_ladder:main"
sai-build-authored-curriculum = "sai.data.authored_curriculum:main"
sai-build-authored-review-packet = "sai.data.authored_review_packet:main"
sai-compile-authored-review = "sai.data.authored_review_compile:main"
sai-generate-authored-model-review = "sai.data.authored_review_model:main"
sai-compare-authored-model-reviews = "sai.data.authored_review_model_compare:main"
sai-attest-authored-human-review = "sai.data.authored_review_human_attestation:main"
sai-adjudicate-authored-review = "sai.data.authored_review_adjudication:main"
sai-build-learnability-curriculum = "sai.data.learnability_curriculum:main"
sai-score-learnability = "sai.data.learnability_score:main"
sai-compose-semantic-learnability = "sai.data.semantic_learnability_curriculum:main"
sai-split-documents = "sai.data.split:main"
sai-build-tokenizers = "sai.tokenizer.build:main"
sai-qualify-tokenizers = "sai.tokenizer.qualification:main"
sai-fla-parity = "sai.training.fla_parity:main"
sai-model-mechanics = "sai.training.model_mechanics:main"
sai-architecture-plan = "sai.architecture.tournament:main"
sai-model-plan = "sai.model.planner:main"
sai-experiment-plan = "sai.training.experiment:main"
sai-workspace-plan = "sai.adaptive.planner:main"
sai-workspace-performance = "sai.adaptive.performance:main"
sai-oracle-slow-path = "sai.adaptive.oracle:main"
sai-public-gate = "sai.gates.public_benchmarks:main"
sai-build-development-mc = "sai.evaluation.population_builder:main"
sai-evaluate-short-screen-mc = "sai.evaluation.short_screen_mc:main"
sai-compare-short-screen-mc = "sai.evaluation.short_screen_compare:main"
sai-shard-development-mc = "sai.evaluation.development_mc_shards:main"
sai-compare-curriculum-benchmarks = "sai.evaluation.curriculum_benchmark_compare:main"
sai-readiness = "sai.readiness:main"
sai-qwen08-workspace-screen = "sai.training.hf_workspace_screen:main"
sai-evaluate-qwen08-workspace-mc = "sai.evaluation.hf_workspace_mc:main"
sai-compare-qwen08-workspace = "sai.evaluation.hf_workspace_compare:main"

[project.optional-dependencies]
train = ["torch>=2.6", "tokenizers>=0.22", "transformers>=5.0"]
dev = ["black>=25.0", "pytest>=8.0", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/sai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
